description = "zsh + Prezto"

[[program]]
name = "zsh"
pixi = "zsh"
note = "the shell these files configure"

[[git]]
name = "Prezto"
repo = "https://github.com/sorin-ionescu/prezto.git"
dest = "~/.zprezto"
check_path = "~/.zprezto/init.zsh"
recursive = true
note = ".zshrc sources ~/.zprezto/init.zsh"
