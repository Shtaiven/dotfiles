# Separate kill/wake keys so repeated presses don't cancel out:
#   ctrl+alt+shift+k  -> KILL   (keyboard + pointer together)
#   ctrl+alt+shift+l  -> "live" / WAKE (both)
# Tapping kill repeatedly just keeps it killed; tapping wake keeps it awake.
# Note: wake from the fairyboard (or any external kbd); ctrl+alt+shift+w was
# avoided because that chord is matrix-blocked on the Dell laptop keyboard.

kill_combo = "ctrl+shift+alt+k"
wake_combo = "ctrl+shift+alt+l"
[groups.laptop_keyboard]
label = "Laptop Keyboard"
keyboards = ["AT Translated Set 2 keyboard"]
wake_on_lock = true

[groups.laptop_trackpad]
label = "Laptop Trackpad"
pointers = ["DELL*Touchpad", "*Synaptics*", "*ALPS TrackPoint*", "PIXA*Touchpad", "UNIW0001:00 093A:0255*"]
wake_on_lock = true
kill_combo = "ctrl+alt+shift+comma"
wake_combo = "ctrl+alt+shift+dot"

[groups.laptop_touchscreen]
label = "Laptop Touchscreen"
pointers = "CSW1322:00 3558:14FD"
kill_combo = "ctrl+alt+shift+i"
wake_combo = "ctrl+alt+shift+o"
