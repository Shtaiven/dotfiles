description = "shell-agnostic config: env, aliases and CLI tool init"

[[program]]
name = "bat"
bin = ["bat", "batcat"]
pixi = "bat"
note = "pager for --help output and the nnn preview pane"

[[program]]
name = "carapace"
pixi = "carapace"
note = "multi-shell completion engine; tools.sh prefers it over per-tool scripts"

[[program]]
name = "fd"
bin = ["fd", "fdfind"]
pixi = "fd-find"
note = "used by the fzf key bindings"

[[program]]
name = "fzf"
pixi = "fzf"
note = "fuzzy finder behind the shell key bindings"

[[program]]
name = "nnn"
pixi = "nnn"
note = "file manager wired up in tools.sh"

[[program]]
name = "ripgrep"
bin = ["rg"]
pixi = "ripgrep"

[[program]]
name = "zoxide"
pixi = "zoxide"
note = "directory jumper; z/zi are defined in aliases.sh"

[[program]]
name = "cargo"
manual = "https://rustup.rs"
optional = true
note = "only needed to build Rust tooling from source"

[[command]]
name = "nnn plugins"
run = "curl -Ls https://raw.githubusercontent.com/jarun/nnn/master/plugins/getplugs | sh"
check_path = "$XDG_CONFIG_HOME/nnn/plugins/preview-tui"
requires = ["curl"]
note = "installs preview-tui, which NNN_PLUG in tools.sh binds"

[[command]]
name = "git-dirs and git-share"
run = 'mkdir -p "$HOME/.local/bin" && for s in git-dirs git-share; do ln -sf "$DOTFILES_DIR/scripts/$s" "$HOME/.local/bin/$s"; done'
check_cmd = 'for s in git-dirs git-share; do [ "$(readlink "$HOME/.local/bin/$s")" = "$DOTFILES_DIR/scripts/$s" ] || exit 1; done'
requires = ["git"]
note = "git subcommands behind `git ls` / `git dirs` and `git share`"
